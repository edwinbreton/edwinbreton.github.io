    <!-- To add a piece: copy one <li> block, change src, alt, and caption.
         Newest goes at the top. Pieces that are square or close to it use
         class="polaroid"; anything a square crop would cut into (a two-page
         spread, two subjects side by side) adds class="photo" to keep its
         own proportions. Captions are empty for now, pending real titles. -->
    <ul class="evidence-board">
      <li>
        <figure class="polaroid photo">
          <img src="images/nami-and-robin.jpg" alt="Two characters standing side by side, one in a straw hat">
          <figcaption></figcaption>
        </figure>
      </li>
      <li>
        <figure class="polaroid photo">
          <img src="images/palette-piece.jpg" alt="A figure holding a weapon, drawn inside an artist's palette shape">
          <figcaption></figcaption>
        </figure>
      </li>
      <li>
        <figure class="polaroid photo">
          <img src="images/spread-01.jpg" alt="Two portrait sketches side by side in an open sketchbook, pink hair and dark hair">

        </figure>
      </li>
      <li>
        <figure class="polaroid photo">
          <img src="images/spread-02.jpg" alt="Two portrait sketches side by side in an open sketchbook, one with tongue out, one hand to head">
          <figcaption></figcaption>
        </figure>
      </li>
      <li>
        <figure class="polaroid photo">
          <img src="images/portrait-01.jpg" alt="Pencil portrait of a woman with pale, wind-blown hair">

        </figure>
      </li>
      <li>
